pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Babric'
			url = 'https://maven.glass-launcher.net/babric'
		}
		maven { url = 'https://jitpack.io/' }
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = "fbx-player-models-multiversion"

include("common")

def requestedFabricProjects = gradle.startParameter.taskNames
		.collect { it.startsWith(":") ? it.substring(1) : it }
		.findAll { it.startsWith("fabric-") }
		.collect { it.split(":")[0] }
		.toSet()

def includeAllFabricProjects = requestedFabricProjects.isEmpty()

if (includeAllFabricProjects || requestedFabricProjects.contains("fabric-1.21.1")) {
	include("fabric-1.21.1")
}

if (includeAllFabricProjects || requestedFabricProjects.contains("fabric-26.2")) {
	include("fabric-26.2")
}

if (includeAllFabricProjects || requestedFabricProjects.contains("fabric-b1.7.3")) {
	include("fabric-b1.7.3")
}
