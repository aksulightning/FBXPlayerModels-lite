name: nightly

on:
  push:
    branches:
      - clientside

  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.tag }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: clientside
            tag: nightly-26.2
            release_name: Nightly Build 26.2
            artifact_name: all-the-models-26.2
            artifact_path: "fabric-26.2/build/libs"
            gradlew_build: "./gradlew :fabric-26.2:build"
            release_file: "fbx-player-models-v2.0.0+26.2+mc26.2.jar"
            java_version: "25"
            minecraft_version: "26.2"
            mod_launcher: "fabric"

          - branch: clientside
            tag: nightly-1.21.1
            release_name: Nightly Build 1.21.1
            artifact_name: all-the-models-1.21.1
            artifact_path: "fabric-1.21.1/build/libs"
            gradlew_build: "./gradlew :fabric-1.21.1:build"
            release_file: "fbx-player-models-v2.0.0+1.21.1+mc1.21.1.jar"
            java_version: "21"
            minecraft_version: "1.21.1"
            mod_launcher: "fabric"

          - branch: clientside
            tag: nightly-b1.7.3
            release_name: Nightly Build Beta 1.7.3
            artifact_name: all-the-models-b1.7.3
            artifact_path: "fabric-b1.7.3/build/libs"
            gradlew_build: "./gradlew :fabric-b1.7.3:remapJar"
            release_file: "fbx-player-models-lite-v2.0.0+b1.7.3+mcb1.7.3.jar"
            java_version: "21"
            minecraft_version: "b1.7.3"
            mod_launcher: "fabric"

    steps:
      - name: Get current date
        id: date_step
        run: echo "date=$(date -u +'%y-%m-%d-%H-%m')" >> $GITHUB_OUTPUT
        
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: setup Java 17 compiler
        id: java17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "microsoft"

      - name: setup Gradle runtime jdk
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java_version }}
          distribution: "microsoft"

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ${{ matrix.gradlew_build }} -Dorg.gradle.java.installations.paths="${{ steps.java17.outputs.path }}"

      - name: capture build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}

      - name: publish nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ matrix.tag }}
          RELEASE_NAME: ${{ matrix.release_name }}
          BRANCH_NAME: ${{ matrix.branch }}
          BUILD_PATH: ${{ matrix.artifact_path }}
        run: bash .github/scripts/publish-nightly.sh
